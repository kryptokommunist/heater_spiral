<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" font-family="sans-serif">
  <defs>
    <!-- Fabric texture: diagonal weave hatching -->
    <pattern id="fabric" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#2a2340"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#332b50" stroke-width="0.8"/>
      <line x1="-2" y1="2" x2="2" y2="-2" stroke="#332b50" stroke-width="0.8"/>
      <line x1="6" y1="10" x2="10" y2="6" stroke="#332b50" stroke-width="0.8"/>
    </pattern>

    <!-- Copper band texture — active (warm copper tone) -->
    <pattern id="copper-active" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#b05a10"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#d4813a" stroke-width="1.2"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#c06820" stroke-width="0.8"/>
    </pattern>

    <!-- Copper band texture — inactive (darker copper) -->
    <pattern id="copper-inactive" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#5a3010"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#7a4520" stroke-width="1.2"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#6a3818" stroke-width="0.8"/>
    </pattern>

    <!-- Heating element texture — active (resistive yarn zigzag) -->
    <pattern id="heater-active" x="0" y="0" width="12" height="8" patternUnits="userSpaceOnUse">
      <rect width="12" height="8" fill="#7a2c00"/>
      <polyline points="0,6 3,2 6,6 9,2 12,6" fill="none" stroke="#ff8c00" stroke-width="1.2"/>
    </pattern>

    <!-- Heating element texture — inactive -->
    <pattern id="heater-inactive" x="0" y="0" width="12" height="8" patternUnits="userSpaceOnUse">
      <rect width="12" height="8" fill="#1a2530"/>
      <polyline points="0,6 3,2 6,6 9,2 12,6" fill="none" stroke="#2e4a5a" stroke-width="1"/>
    </pattern>

    <!-- Glow filter for active pixel -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Current arrow markers -->
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffcc02"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffcc02"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="420" y="30" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="bold">Heat Pixel Jacket — Textile Matrix Wiring</text>
  <text x="420" y="47" text-anchor="middle" fill="#78909c" font-size="10">Pixel (row1, col1) active: row1=12V, col1=GND. Flexible copper bands sewn into jacket fabric.</text>

  <!-- Fabric background -->
  <rect x="60" y="60" width="530" height="490" rx="12" fill="url(#fabric)" stroke="#4a3a6a" stroke-width="2"/>
  <text x="325" y="84" text-anchor="middle" fill="#7a6a9a" font-size="11">textile substrate (jacket back)</text>

  <!--
    Col centres: x = 180, 325, 470   (band: ±9px → x-9 to x+9)
    Row centres: y = 150, 295, 440   (band: ±9px → y-9 to y+9)
    Pixel box: 70w × 50h, centred on intersection
  -->

  <!-- ═══ VERTICAL COL COPPER BANDS (drawn first, behind row bands) ═══ -->

  <!-- col1 — ACTIVE (bright copper + yellow outline) -->
  <rect x="171" y="68" width="18" height="474" fill="url(#copper-active)" rx="2"/>
  <rect x="171" y="68" width="18" height="474" fill="none" stroke="#ffcc02" stroke-width="1.5" rx="2"/>
  <text x="180" y="55" text-anchor="middle" fill="#ffcc02" font-size="11" font-weight="bold">col 1</text>
  <text x="180" y="67" text-anchor="middle" fill="#ffcc02" font-size="10">GND</text>

  <!-- col2 — inactive -->
  <rect x="316" y="68" width="18" height="474" fill="url(#copper-inactive)" rx="2"/>
  <rect x="316" y="68" width="18" height="474" fill="none" stroke="#7a4520" stroke-width="1" rx="2"/>
  <text x="325" y="55" text-anchor="middle" fill="#c08040" font-size="11">col 2</text>
  <text x="325" y="67" text-anchor="middle" fill="#546e8a" font-size="10">float</text>

  <!-- col3 — inactive -->
  <rect x="461" y="68" width="18" height="474" fill="url(#copper-inactive)" rx="2"/>
  <rect x="461" y="68" width="18" height="474" fill="none" stroke="#7a4520" stroke-width="1" rx="2"/>
  <text x="470" y="55" text-anchor="middle" fill="#c08040" font-size="11">col 3</text>
  <text x="470" y="67" text-anchor="middle" fill="#546e8a" font-size="10">float</text>

  <!-- ═══ HORIZONTAL ROW COPPER BANDS (drawn on top, cover col crossings) ═══ -->

  <!-- row1 — ACTIVE (bright copper + yellow outline) -->
  <rect x="68" y="141" width="514" height="18" fill="url(#copper-active)" rx="2"/>
  <rect x="68" y="141" width="514" height="18" fill="none" stroke="#ffcc02" stroke-width="1.5" rx="2"/>
  <text x="56" y="153" text-anchor="end" fill="#ffcc02" font-size="11" font-weight="bold">row 1</text>
  <text x="56" y="165" text-anchor="end" fill="#ffcc02" font-size="10">12V</text>

  <!-- row2 — inactive -->
  <rect x="68" y="286" width="514" height="18" fill="url(#copper-inactive)" rx="2"/>
  <rect x="68" y="286" width="514" height="18" fill="none" stroke="#7a4520" stroke-width="1" rx="2"/>
  <text x="56" y="298" text-anchor="end" fill="#c08040" font-size="11">row 2</text>
  <text x="56" y="310" text-anchor="end" fill="#546e8a" font-size="10">float</text>

  <!-- row3 — inactive -->
  <rect x="68" y="431" width="514" height="18" fill="url(#copper-inactive)" rx="2"/>
  <rect x="68" y="431" width="514" height="18" fill="none" stroke="#7a4520" stroke-width="1" rx="2"/>
  <text x="56" y="443" text-anchor="end" fill="#c08040" font-size="11">row 3</text>
  <text x="56" y="455" text-anchor="end" fill="#546e8a" font-size="10">float</text>

  <!-- ═══ INSULATING PATCHES at crossings (col passes under row) ═══ -->
  <rect x="171" y="141" width="18" height="18" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="316" y="141" width="18" height="18" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="461" y="141" width="18" height="18" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="171" y="286" width="18" height="18" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="316" y="286" width="18" height="18" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="461" y="286" width="18" height="18" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="171" y="431" width="18" height="18" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="316" y="431" width="18" height="18" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="461" y="431" width="18" height="18" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ═══ HEAT PIXEL PATCHES (centred on intersections, straddle both bands) ═══ -->

  <!-- (row1, col1) — ACTIVE -->
  <rect x="142" y="122" width="76" height="56" rx="8" fill="#ff4400" opacity="0.25" filter="url(#glow)"/>
  <rect x="145" y="125" width="70" height="50" rx="6" fill="url(#heater-active)" stroke="#ff6d00" stroke-width="2"/>
  <rect x="145" y="125" width="70" height="50" rx="6" fill="none" stroke="#ffcc02" stroke-width="1.5"/>
  <text x="180" y="146" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">~1.2 kΩ</text>
  <text x="180" y="160" text-anchor="middle" fill="#ffcc02" font-size="9">ACTIVE</text>
  <text x="180" y="172" text-anchor="middle" fill="#ffaa00" font-size="8">40–70°C</text>
  <!-- callout -->
  <line x1="215" y1="128" x2="258" y2="104" stroke="#ffcc02" stroke-width="1.2"/>
  <text x="262" y="100" fill="#ffcc02" font-size="10" font-weight="bold">heating element</text>
  <text x="262" y="112" fill="#ffaa00" font-size="9">resistive yarn stitched into fabric</text>
  <text x="262" y="124" fill="#ffaa00" font-size="9">I = 5–12.5 mA  P = 0.05–0.15 W</text>

  <!-- (row1, col2) -->
  <rect x="290" y="125" width="70" height="50" rx="6" fill="url(#heater-inactive)" stroke="#2e4a5a" stroke-width="1.5"/>
  <text x="325" y="148" text-anchor="middle" fill="#37607a" font-size="10">~1.2 kΩ</text>
  <text x="325" y="162" text-anchor="middle" fill="#2e4a5a" font-size="9">inactive</text>

  <!-- (row1, col3) -->
  <rect x="435" y="125" width="70" height="50" rx="6" fill="url(#heater-inactive)" stroke="#2e4a5a" stroke-width="1.5"/>
  <text x="470" y="148" text-anchor="middle" fill="#37607a" font-size="10">~1.2 kΩ</text>
  <text x="470" y="162" text-anchor="middle" fill="#2e4a5a" font-size="9">inactive</text>

  <!-- (row2, col1) -->
  <rect x="145" y="270" width="70" height="50" rx="6" fill="url(#heater-inactive)" stroke="#2e4a5a" stroke-width="1.5"/>
  <text x="180" y="293" text-anchor="middle" fill="#37607a" font-size="10">~1.2 kΩ</text>
  <text x="180" y="307" text-anchor="middle" fill="#2e4a5a" font-size="9">inactive</text>

  <!-- (row2, col2) -->
  <rect x="290" y="270" width="70" height="50" rx="6" fill="url(#heater-inactive)" stroke="#2e4a5a" stroke-width="1.5"/>
  <text x="325" y="293" text-anchor="middle" fill="#37607a" font-size="10">~1.2 kΩ</text>
  <text x="325" y="307" text-anchor="middle" fill="#2e4a5a" font-size="9">inactive</text>

  <!-- (row2, col3) -->
  <rect x="435" y="270" width="70" height="50" rx="6" fill="url(#heater-inactive)" stroke="#2e4a5a" stroke-width="1.5"/>
  <text x="470" y="293" text-anchor="middle" fill="#37607a" font-size="10">~1.2 kΩ</text>
  <text x="470" y="307" text-anchor="middle" fill="#2e4a5a" font-size="9">inactive</text>

  <!-- (row3, col1) -->
  <rect x="145" y="415" width="70" height="50" rx="6" fill="url(#heater-inactive)" stroke="#2e4a5a" stroke-width="1.5"/>
  <text x="180" y="438" text-anchor="middle" fill="#37607a" font-size="10">~1.2 kΩ</text>
  <text x="180" y="452" text-anchor="middle" fill="#2e4a5a" font-size="9">inactive</text>

  <!-- (row3, col2) -->
  <rect x="290" y="415" width="70" height="50" rx="6" fill="url(#heater-inactive)" stroke="#2e4a5a" stroke-width="1.5"/>
  <text x="325" y="438" text-anchor="middle" fill="#37607a" font-size="10">~1.2 kΩ</text>
  <text x="325" y="452" text-anchor="middle" fill="#2e4a5a" font-size="9">inactive</text>

  <!-- (row3, col3) -->
  <rect x="435" y="415" width="70" height="50" rx="6" fill="url(#heater-inactive)" stroke="#2e4a5a" stroke-width="1.5"/>
  <text x="470" y="438" text-anchor="middle" fill="#37607a" font-size="10">~1.2 kΩ</text>
  <text x="470" y="452" text-anchor="middle" fill="#2e4a5a" font-size="9">inactive</text>

  <!-- ═══ CURRENT FLOW ARROWS ═══ -->
  <line x1="520" y1="150" x2="220" y2="150" stroke="#ffcc02" stroke-width="2" stroke-dasharray="7,3" marker-end="url(#arr)"/>
  <line x1="180" y1="178" x2="180" y2="520" stroke="#ffcc02" stroke-width="2" stroke-dasharray="7,3" marker-end="url(#arr2)"/>

  <!-- GND symbol -->
  <line x1="173" y1="524" x2="187" y2="524" stroke="#ffcc02" stroke-width="2"/>
  <line x1="175" y1="530" x2="185" y2="530" stroke="#ffcc02" stroke-width="1.5"/>
  <line x1="177" y1="536" x2="183" y2="536" stroke="#ffcc02" stroke-width="1"/>
  <text x="180" y="550" text-anchor="middle" fill="#ffcc02" font-size="10">GND</text>

  <!-- 12V label -->
  <text x="590" y="154" fill="#ffcc02" font-size="10" font-weight="bold">12V</text>

  <!-- Float markers -->
  <circle cx="325" cy="552" r="5" fill="none" stroke="#c08040" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="325" y="566" text-anchor="middle" fill="#546e8a" font-size="9">float</text>
  <circle cx="470" cy="552" r="5" fill="none" stroke="#c08040" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="470" y="566" text-anchor="middle" fill="#546e8a" font-size="9">float</text>
  <circle cx="588" cy="295" r="5" fill="none" stroke="#c08040" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="600" y="299" fill="#546e8a" font-size="9">float</text>
  <circle cx="588" cy="440" r="5" fill="none" stroke="#c08040" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="600" y="444" fill="#546e8a" font-size="9">float</text>

  <!-- ═══ CALLOUT ANNOTATIONS ═══ -->

  <!-- Copper band callout -->
  <line x1="316" y1="268" x2="292" y2="238" stroke="#d4813a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="220" y="228" fill="#d4813a" font-size="10" font-weight="bold">flexible copper band</text>
  <text x="220" y="240" fill="#78909c" font-size="9">28–30 AWG, ~0.05 Ohm/cm</text>
  <text x="220" y="252" fill="#78909c" font-size="9">sewn flat into textile, ~18 mm wide</text>

  <!-- Insulation crossing callout -->
  <line x1="316" y1="295" x2="292" y2="318" stroke="#9a7aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="215" y="334" fill="#9a7aaa" font-size="10">insulating patch at crossing</text>
  <text x="215" y="346" fill="#78909c" font-size="9">col band passes under row band</text>

  <!-- Driver PCB box -->
  <rect x="622" y="120" width="148" height="108" rx="6" fill="#0d1b2a" stroke="#546e8a" stroke-width="1.5"/>
  <text x="696" y="141" text-anchor="middle" fill="#cfd8dc" font-size="11" font-weight="bold">Driver PCB</text>
  <text x="696" y="156" text-anchor="middle" fill="#78909c" font-size="9">74HC595 chain</text>
  <text x="696" y="169" text-anchor="middle" fill="#78909c" font-size="9">3-wire SPI to MCU</text>
  <text x="696" y="185" text-anchor="middle" fill="#ffcc02" font-size="9">12V / 3S LiPo</text>
  <text x="696" y="200" text-anchor="middle" fill="#a5d6a7" font-size="9">28–30 AWG copper leads</text>
  <line x1="622" y1="152" x2="590" y2="150" stroke="#ffcc02" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- ═══ LEGEND ═══ -->
  <rect x="60" y="578" width="700" height="70" rx="6" fill="#0d1b2a" stroke="#37474f" stroke-width="1"/>

  <rect x="76" y="592" width="30" height="12" fill="url(#copper-active)" stroke="#ffcc02" stroke-width="1.5"/>
  <text x="112" y="602" fill="#ffcc02" font-size="10">Active copper band (driven: 12V or GND)</text>

  <rect x="76" y="610" width="30" height="12" fill="url(#copper-inactive)" stroke="#7a4520" stroke-width="1"/>
  <text x="112" y="620" fill="#c08040" font-size="10">Inactive copper band (floating)</text>

  <rect x="310" y="592" width="30" height="12" fill="url(#heater-active)" stroke="#ff6d00" stroke-width="1"/>
  <text x="346" y="602" fill="#ff6d00" font-size="10">Active heating element (resistive yarn)</text>

  <rect x="310" y="610" width="30" height="12" fill="url(#heater-inactive)" stroke="#2e4a5a" stroke-width="1"/>
  <text x="346" y="620" fill="#546e8a" font-size="10">Inactive heating element</text>

  <rect x="560" y="592" width="30" height="12" fill="#3a2a55" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="596" y="602" fill="#9a7aaa" font-size="10">Insulating crossing patch</text>

  <rect x="560" y="610" width="30" height="12" fill="url(#fabric)" stroke="#4a3a6a" stroke-width="1"/>
  <text x="596" y="620" fill="#7a6a9a" font-size="10">Textile substrate</text>

</svg>
